name: MIO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Upload generated package lock
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mio-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi

      - name: Verify clean lockfile install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
